name: Test Worker

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # npm ci fails when the lockfile disagrees with the resolved tree, which
      # catches lockfiles regenerated by a different npm major before deploy does.
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test
